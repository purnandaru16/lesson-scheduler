# Local Supabase configuration for Lesson Scheduler.
# Generated/maintained in source control. Do not place production secrets here.

project_id = "lesson-scheduler"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**"
]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
